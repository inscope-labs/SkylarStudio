name: Phase 2 libtailscale Bind Spike

on:
  workflow_dispatch:

jobs:
  build-tsnet-binding:
    name: Build tsnet Android Binding (gomobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: false

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install gomobile
        run: |
          echo "$HOME/go/bin" >> $GITHUB_PATH
          export PATH="$HOME/go/bin:$PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Bootstrap Go module for the binding (tools/tsnet-android-bind)
        # Root cause of the prior failure: `gomobile bind` needs to run inside
        # a real Go module that lists golang.org/x/mobile (specifically the
        # gobind tool) as a dependency via a go.mod tool directive. This repo
        # has no go.mod anywhere (it's a Kotlin/Android project) so there was
        # nothing for it to resolve against.
        #
        # go.mod/go.sum are deliberately NOT committed to the repo and are
        # generated fresh here instead: this sandbox has no path to the Go
        # module proxy to produce a real, verifiable go.sum, and committing a
        # hand-typed one would be exactly the kind of fabricated stand-in
        # AGENTS.md §6 warns against. CI has real network access, so it
        # resolves the actual dependency graph itself, every run. Once the
        # spike is validated (go decision, not just build success), pin and
        # commit a real go.mod/go.sum as a follow-up for reproducibility.
        run: |
          export PATH="$HOME/go/bin:$PATH"
          mkdir -p tools/tsnet-android-bind
          cd tools/tsnet-android-bind
          go mod init github.com/inscope-labs/skylarstudio/tools/tsnet-android-bind
          # NOTE: gomobile's own error text suggests `go get -tool ...`, but
          # -tool is Go 1.24+ only and this workflow pins go-version 1.23.0
          # above. A plain `go get` adds x/mobile as a normal required
          # dependency, which is all gomobile bind actually needs ("in the
          # current module dependency graph") on any Go version.
          go get golang.org/x/mobile/cmd/gobind
          go get tailscale.com/tsnet

      - name: Build tsnet Android AAR
        run: |
          export PATH="$HOME/go/bin:$PATH"
          cd tools/tsnet-android-bind
          # Target Android API 24 matching minSdk in app/build.gradle.kts
          gomobile bind -target=android -androidapi=24 -o ../../tsnet-android.aar tailscale.com/tsnet

      - name: Upload tsnet AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsnet-android-aar
          path: tsnet-android.aar
          if-no-files-found: error
          retention-days: 14

  jvm-build-check:
    name: JVM-level Build Check (compileDebugKotlin)
    needs: build-tsnet-binding
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download tsnet AAR artifact
        uses: actions/download-artifact@v4
        with:
          name: tsnet-android-aar
          path: app/libs

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run JVM Kotlin compile check (compileDebugKotlin)
        run: |
          # JVM-level compile check only: no emulator, no assembleDebug, no release steps.
          # Note: this is expected to highlight pending binding substitutions in TsnetMeshNode.kt.
          ./gradlew :app:compileDebugKotlin

  manifest-guardrail-check:
    name: V2.2 Manifest Guardrail Check (No VpnService)
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce Phase 2 Criterion V2.2 (Forbidden VpnService)
        run: |
          echo "Scanning app/src/main/AndroidManifest.xml for VpnService or BIND_VPN_SERVICE..."
          if grep -E "VpnService|BIND_VPN_SERVICE" app/src/main/AndroidManifest.xml; then
            echo "::error::CRITICAL VIOLATION: VpnService or BIND_VPN_SERVICE found in app/src/main/AndroidManifest.xml"
            echo "Phase 2 Validation Criterion V2.2 requires embedded userspace networking with ZERO system VPN privileges."
            exit 1
          fi
          echo "PASS: Validation Criterion V2.2 satisfied (no VpnService declared)."
