name: Phase 2 libtailscale Bind Spike

on:
  workflow_dispatch:

jobs:
  build-tsnet-binding:
    name: Build tsnet Android Binding (gomobile)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: false

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install gomobile
        run: |
          echo "$HOME/go/bin" >> $GITHUB_PATH
          export PATH="$HOME/go/bin:$PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Bootstrap Go module for the binding (tools/tsnet-android-bind)
        # Root cause of the prior failure: `gomobile bind` needs to run inside
        # a real Go module that lists golang.org/x/mobile (specifically the
        # gobind tool) as a dependency via a go.mod tool directive. This repo
        # has no go.mod anywhere (it's a Kotlin/Android project) so there was
        # nothing for it to resolve against.
        #
        # go.mod/go.sum are deliberately NOT committed to the repo and are
        # generated fresh here instead: this sandbox has no path to the Go
        # module proxy to produce a real, verifiable go.sum, and committing a
        # hand-typed one would be exactly the kind of fabricated stand-in
        # AGENTS.md §6 warns against. CI has real network access, so it
        # resolves the actual dependency graph itself, every run. Once the
        # spike is validated (go decision, not just build success), pin and
        # commit a real go.mod/go.sum as a follow-up for reproducibility.
        run: |
          export PATH="$HOME/go/bin:$PATH"
          mkdir -p tools/tsnet-android-bind
          cd tools/tsnet-android-bind
          go mod init github.com/inscope-labs/skylarstudio/tools/tsnet-android-bind
          # NOTE: gomobile's own error text suggests `go get -tool ...`, but
          # -tool is Go 1.24+ only and this workflow pins go-version 1.23.0
          # above. A plain `go get` adds x/mobile as a normal required
          # dependency, which is all gomobile bind actually needs ("in the
          # current module dependency graph") on any Go version.
          go get golang.org/x/mobile/cmd/gobind
          go get tailscale.com/tsnet

      - name: Build tsnet Android AAR
        run: |
          export PATH="$HOME/go/bin:$PATH"
          cd tools/tsnet-android-bind
          # Bind the local wrapper package (./tsnetbind), not
          # tailscale.com/tsnet directly — gobind can't bind tsnet's own
          # exported surface as-is (Server.Loopback() returns 4 values;
          # gobind allows at most one non-error return). See
          # tsnetbind/tsnetbind.go's doc comment for the full explanation.
          #
          # -work retains gomobile's temporary work directory (normally
          # deleted on exit) so the next step can pull the actual
          # gobind-generated Java source out of it. Target Android API 24
          # matching minSdk in app/build.gradle.kts.
          gomobile bind -work -target=android -androidapi=24 -o ../../tsnet-android.aar ./tsnetbind 2>&1 | tee /tmp/gomobile-bind.log

      - name: Commit the actual generated Java source for inspection
        # This exists purely so the real gobind-generated Java API surface
        # is readable via the GitHub Contents API. Logs and artifact
        # downloads for this repo are served from a blob-storage host that
        # isn't reachable from the environment doing this wiring work —
        # committing the small set of real .java files here is the only
        # way to verify their actual class/method names/signatures instead
        # of guessing. Safe to run every time: this workflow only triggers
        # on workflow_dispatch, so this push can't retrigger it.
        run: |
          WORKDIR=$(grep -oE '^WORK=.*' /tmp/gomobile-bind.log | head -1 | cut -d= -f2)
          if [ -z "${WORKDIR}" ]; then
            # Fallback: gomobile's work dirs follow /tmp/gomobile-work-<n>
            # (confirmed in the original bind failure's own error path,
            # e.g. -outdir=/tmp/gomobile-work-2321966322). Pick the most
            # recently modified one if the WORK= line wasn't in the format
            # expected.
            WORKDIR=$(ls -dt /tmp/gomobile-work-* 2>/dev/null | head -1)
          fi
          echo "gomobile work dir: ${WORKDIR}"
          rm -rf tools/tsnet-android-bind/generated-java-preview
          mkdir -p tools/tsnet-android-bind/generated-java-preview
          if [ -n "${WORKDIR}" ] && [ -d "${WORKDIR}" ]; then
            find "${WORKDIR}" -name '*.java' -exec cp {} tools/tsnet-android-bind/generated-java-preview/ \;
          fi
          ls -la tools/tsnet-android-bind/generated-java-preview/ || true
          if [ -z "$(ls -A tools/tsnet-android-bind/generated-java-preview/ 2>/dev/null)" ]; then
            echo "No .java files found under the work dir — leaving a note instead." > tools/tsnet-android-bind/generated-java-preview/NOTE.txt
            echo "WORK dir was: ${WORKDIR}" >> tools/tsnet-android-bind/generated-java-preview/NOTE.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/tsnet-android-bind/generated-java-preview
          if ! git diff --cached --quiet; then
            git commit -m "ci: commit actual gobind-generated Java source for tsnetbind (inspection only)"
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi

      - name: Upload tsnet AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsnet-android-aar
          path: tsnet-android.aar
          if-no-files-found: error
          retention-days: 14

  jvm-build-check:
    name: JVM-level Build Check (compileDebugKotlin)
    needs: build-tsnet-binding
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Download tsnet AAR artifact
        uses: actions/download-artifact@v4
        with:
          name: tsnet-android-aar
          path: app/libs

      - name: Run JVM Kotlin compile check (compileDebugKotlin)
        run: |
          # JVM-level compile check only: no emulator, no assembleDebug, no release steps.
          # Note: this is expected to highlight pending binding substitutions in TsnetMeshNode.kt.
          # Uses `gradle` directly (gradle/actions/setup-gradle), not ./gradlew —
          # gradlew, gradlew.bat, and gradle-wrapper.jar were never committed to
          # this repo (only gradle/wrapper/gradle-wrapper.properties exists), so
          # the wrapper script doesn't exist to invoke. build-apk-debug.yml
          # already established this same pattern (gradle-version pinned to
          # 9.3.1, matching gradle-wrapper.properties) for the same reason.
          gradle :app:compileDebugKotlin

  manifest-guardrail-check:
    name: V2.2 Manifest Guardrail Check (No VpnService)
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce Phase 2 Criterion V2.2 (Forbidden VpnService)
        run: |
          echo "Scanning app/src/main/AndroidManifest.xml for VpnService or BIND_VPN_SERVICE..."
          if grep -E "VpnService|BIND_VPN_SERVICE" app/src/main/AndroidManifest.xml; then
            echo "::error::CRITICAL VIOLATION: VpnService or BIND_VPN_SERVICE found in app/src/main/AndroidManifest.xml"
            echo "Phase 2 Validation Criterion V2.2 requires embedded userspace networking with ZERO system VPN privileges."
            exit 1
          fi
          echo "PASS: Validation Criterion V2.2 satisfied (no VpnService declared)."
